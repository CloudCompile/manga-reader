name: CI

# Type-check, run the fixture-backed test suite, and build, so a parser or UI
# regression cannot reach main unnoticed. Everything here runs offline: the
# tests use captured pages, so CI stays fast and never fails on a source
# outage. Live reachability is covered separately by source-health.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
